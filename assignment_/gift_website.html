<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="script.css">
    <title>선물 추천</title>
    <script>
        window.onload = function() {
            let menuItems = document.querySelectorAll(".menu-item");
            let title = document.querySelector("#title");
            let sliderArea = document.querySelector("#slider-area");
            let currentMenu = "전체";

            menuItems[0].style.fontWeight = "bold";

            for (let i = 0; i < menuItems.length; i++) {
                let item = menuItems[i];

                item.addEventListener("mouseover", function() {
                    item.style.fontWeight = "bold";
                });

                item.addEventListener("mouseout", function() {
                    if (item.textContent !== currentMenu) {
                        item.style.fontWeight = "normal";
                    }
                });

               
                item.addEventListener("click", function() {
                    currentMenu = item.textContent;

                    
                    for (let j = 0; j < menuItems.length; j++) {
                        menuItems[j].style.fontWeight = "normal";
                    }
                    item.style.fontWeight = "bold";

                    
                    if (currentMenu === "전체") {
                        title.textContent = "🔥실시간 전체 인기선물 TOP 6";
                        sliderArea.style.display = "none";
                    } else {
                        title.textContent = "🎁 " + currentMenu + " 추천 선물";
                        sliderArea.style.display = "block";
                    }
                });
            }
        }
    </script>
</head>
